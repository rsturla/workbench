name: Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild weekly to pick up base image updates
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: quay.io/rsturla-dev
  IMAGE_NAME: workbench
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Maximize build space
        run: |
          set -xeuo pipefail
          sudo df -h
          # Remove large, unused toolchains in the background as systemd units so
          # the build can start immediately.
          n=0
          runcleanup() {
            sudo systemd-run -r -u action-cleanup-${n} -- "$@"
            n=$((n + 1))
          }
          runcleanup docker image prune --all --force
          for dir in \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/lib/firefox \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /usr/share/swift \
            /opt/az; do
            runcleanup rm -rf "$dir"
          done

      - name: Install podman, just and skopeo from plucky
        run: |
          set -xeuo pipefail
          echo 'deb http://azure.archive.ubuntu.com/ubuntu plucky universe main' | sudo tee /etc/apt/sources.list.d/plucky.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades crun/plucky podman/plucky skopeo/plucky just

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate image metadata
        id: meta
        run: |
          TAGS="latest $(date +%Y%m%d) ${GITHUB_SHA::7}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        run: |
          just build
          echo "image_id=$(cat /tmp/image.id)" >> "$GITHUB_OUTPUT"

      # Generate the SBOM from the locally-built image. Scanning a saved
      # oci-archive avoids re-pulling the multi-hundred-layer image from the
      # registry, which previously stalled the runner until it was cancelled.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11

      - name: Generate SBOM
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -xeuo pipefail
          podman save --format oci-archive -o /tmp/image.oci "$IMAGE_ID"
          syft "oci-archive:/tmp/image.oci" --output spdx-json=sbom.spdx.json
          jq . sbom.spdx.json > /dev/null

      - name: Login to Quay.io
        if: env.PUSH_IMAGE == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          podman login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io

      - name: Tag and push image
        if: env.PUSH_IMAGE == 'true'
        id: push
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -xeuo pipefail
          for tag in $TAGS; do
            podman tag "$IMAGE_ID" "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
            podman push --digestfile=/tmp/push-digest.txt "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
          done
          echo "digest=$(cat /tmp/push-digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: env.PUSH_IMAGE == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign image with cosign
        if: env.PUSH_IMAGE == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            --yes \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"

      - name: Attach SBOM to image
        if: env.PUSH_IMAGE == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --key env://COSIGN_PRIVATE_KEY \
            --type spdxjson \
            --predicate sbom.spdx.json \
            --yes \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"
