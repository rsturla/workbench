name: Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild weekly to pick up base image updates
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: quay.io/rsturla-dev
  IMAGE_NAME: workbench
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - name: Free up disk space
        run: |
          set -xeuo pipefail
          sudo df -h
          unwanted_dirs=(
            /usr/share/dotnet
            /opt/ghc
            /usr/local/lib/android
            /opt/hostedtoolcache/CodeQL
            /usr/local/.ghcup
            /usr/lib/firefox
            /opt/google/chrome
            /opt/microsoft/msedge
            /usr/share/swift
            /opt/az
          )
          # Start background removal operations as systemd units
          n=0
          runcleanup() {
            sudo systemd-run -r -u action-cleanup-${n} -- "$@"
            n=$((n + 1))
          }
          runcleanup docker image prune --all --force
          for x in "${unwanted_dirs[@]}"; do
            runcleanup rm -rf "$x"
          done
          sudo df -h

      - name: Install podman and just from plucky
        run: |
          set -xeuo pipefail
          echo 'deb http://azure.archive.ubuntu.com/ubuntu plucky universe main' | sudo tee /etc/apt/sources.list.d/plucky.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades crun/plucky podman/plucky skopeo/plucky just

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate image metadata
        id: meta
        run: |
          TAGS="latest $(date +%Y%m%d) ${GITHUB_SHA::7}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to Quay.io
        if: env.PUSH_IMAGE == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          podman login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io
          docker login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io

      - name: Build image
        id: build
        run: |
          just build
          IMAGE_ID=$(cat /tmp/image.id)
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Tag and push image
        if: env.PUSH_IMAGE == 'true'
        id: push
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            podman tag "$IMAGE_ID" "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
            podman push --digestfile=/tmp/push-digest.txt "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"
          done
          DIGEST=$(cat /tmp/push-digest.txt)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: env.PUSH_IMAGE == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign image with cosign
        if: env.PUSH_IMAGE == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            --yes \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"

  sbom:
    runs-on: ubuntu-24.04
    needs: build
    if: needs.build.outputs.pushed == 'true'
    permissions:
      contents: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}

    steps:
      - name: Install podman from plucky
        run: |
          set -xeuo pipefail
          echo 'deb http://azure.archive.ubuntu.com/ubuntu plucky universe main' | sudo tee /etc/apt/sources.list.d/plucky.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades podman/plucky

      - name: Login to Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          podman login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io
          docker login -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD" quay.io

      - name: Install syft
        uses: anchore/sbom-action/download-syft@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Generate SBOM
        run: |
          syft "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST" \
            --output spdx-json=sbom.spdx.json
          # Validate JSON
          jq . sbom.spdx.json > /dev/null

      - name: Attach SBOM to image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign attest --key env://COSIGN_PRIVATE_KEY \
            --type spdxjson \
            --predicate sbom.spdx.json \
            --yes \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"
